:root{
  color-scheme:dark;

  --gutter:max(clamp(16px,5vw,80px),env(safe-area-inset-left,0px),env(safe-area-inset-right,0px));

*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;background:var(--ink);color:var(--ash);font-family:var(--f-body);font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid #c6ff3d;outline-offset:3px;border-radius:4px}
header,main,footer{padding-inline:var(--gutter)}
header{display:flex;align-items:center;padding-block:calc(16px + env(safe-area-inset-top,0px)) 16px;border-bottom:1px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.16em}
.brand svg{width:18px;height:24px}
main{display:grid;align-content:center;gap:20px;padding-block:64px}
.code{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(120px,30vw,300px);line-height:.82;color:#2a211b;letter-spacing:.02em}
h1{margin:0;font-family:var(--f-head);font-size:clamp(28px,4vw,48px);line-height:1.2;letter-spacing:-.03em;text-wrap:balance}
p{margin:0;max-width:34em;color:var(--ash-dim)}
nav ul{list-style:none;margin:8px 0 0;padding:0;display:grid;max-width:30em;border-top:1px solid var(--line)}
nav li a{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--line);text-decoration:none}
nav li a span{font-family:var(--f-mono);font-size:12px;color:var(--ash-faint)}
nav li a:hover{color:var(--gold)}
footer{padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:12px;color:var(--ash-faint)}
